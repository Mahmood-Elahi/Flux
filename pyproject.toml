[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux"
version = "0.1.0"
description = "A CUDA-accelerated transformer inference system for SmolLM2-135M"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["flux*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
